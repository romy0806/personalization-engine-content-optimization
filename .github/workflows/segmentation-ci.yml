name: Segmentation CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint MIND segmentation
        run: ruff check src/segmentation.py src/mind_data.py tests scripts
      - name: Format check MIND segmentation
        run: ruff format --check src/segmentation.py src/mind_data.py tests scripts
      - name: Test
        run: python -m pytest -q
