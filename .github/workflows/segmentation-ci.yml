name: Segmentation CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Phase 1
        run: ruff check src/segmentation.py src/synthetic_data.py tests scripts
      - name: Format check Phase 1
        run: ruff format --check src/segmentation.py src/synthetic_data.py tests scripts
      - name: Test
        run: python -m pytest -q
